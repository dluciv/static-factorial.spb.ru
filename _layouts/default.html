<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark' && t !== 'auto') t = 'auto';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}АНО «ФАКТОРИАЛ» — культурно-научные и образовательные проекты</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="description" content="АНО «ФАКТОРИАЛ» — культурно-научные, образовательные и цифровые проекты на стыке просвещения, науки, IT и игровых форматов.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="alternate" type="application/atom+xml" title="АНО «ФАКТОРИАЛ» — События (Atom)" href="/atom.xml">
  <link rel="alternate" type="application/rss+xml" title="АНО «ФАКТОРИАЛ» — События (RSS)" href="/rss.xml">
<script data-goatcounter="https://factorial-spb-ru.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</head>
<body>

{% include header.html %}

<main id="top">
  {{ content }}
</main>

{% include footer.html %}

<script src="/assets/js/theme.js"></script>
<script src="/assets/js/gallery.js"></script>
</body>
</html>
