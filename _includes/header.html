<header class="site-header">
  <div class="container site-header__row">
    <a href="/" class="brand" aria-label="АНО ФАКТОРИАЛ">
      <div class="brand__mark">
        <img class="theme-logo theme-logo--light" src="/img/logo-black.svg" alt="Логотип АНО «Факториал»" width="42" height="42">
        <img class="theme-logo theme-logo--dark" src="/img/logo-white.svg" alt="" aria-hidden="true" width="42" height="42">
      </div>
      <div class="brand__text">
        <p class="brand__title">АНО «ФАКТОРИАЛ»</p>
        <p class="brand__subtitle">Культурно-научные и образовательные проекты</p>
      </div>
    </a>

    <nav class="nav" aria-label="Основная навигация">
      <a href="/#about">Подход</a>
      <a href="/#projects">Проекты</a>
      <a href="/#news">События</a>
      <a href="/#team">Команда</a>
      <a href="/#contacts" class="button button--light">Связаться</a>
      <div class="theme-switch">
        <button type="button" class="theme-switch__toggle" aria-label="Тема: Авто" aria-expanded="false" aria-haspopup="menu" title="Тема оформления">
          <span class="theme-switch__icon icon--auto"></span>
          <span class="theme-switch__icon icon--light"></span>
          <span class="theme-switch__icon icon--dark"></span>
        </button>
        <div class="theme-switch__menu" role="menu" aria-label="Выбор темы">
          <button type="button" class="theme-switch__option" data-theme-value="auto" role="menuitemradio" aria-checked="true">
            <span class="theme-switch__option-icon icon--auto" aria-hidden="true"></span>
            <span>Авто</span>
          </button>
          <button type="button" class="theme-switch__option" data-theme-value="light" role="menuitemradio" aria-checked="false">
            <span class="theme-switch__option-icon icon--light" aria-hidden="true"></span>
            <span>Светлая</span>
          </button>
          <button type="button" class="theme-switch__option" data-theme-value="dark" role="menuitemradio" aria-checked="false">
            <span class="theme-switch__option-icon icon--dark" aria-hidden="true"></span>
            <span>Тёмная</span>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
